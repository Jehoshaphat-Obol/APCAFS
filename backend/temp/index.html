<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Step Payment Form</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .step-indicator .step {
      display: inline-block;
      margin-right: 20px;
    }
    .step .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #ccc;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 5px;
    }
    .step.active .circle {
      background-color: #0d6efd;
    }
    .step.completed .circle {
      background-color: #198754;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="step-indicator mb-4 d-flex justify-content-center">
      <div class="step" id="step-1-indicator">
        <span class="circle">1</span> Login
      </div>
      <div class="step" id="step-2-indicator">
        <span class="circle">2</span> Address
      </div>
      <div class="step" id="step-3-indicator">
        <span class="circle">3</span> Payment
      </div>
      <div class="step" id="step-4-indicator">
        <span class="circle">4</span> Completed
      </div>
    </div>

    <form id="multiStepForm">
      <!-- Step 1 -->
      <div class="card mb-3 step-content" id="step-1">
        <div class="card-body">
          <h5 class="card-title">Login</h5>
          <input type="email" class="form-control mb-3" placeholder="Email" required>
          <input type="password" class="form-control mb-3" placeholder="Password" required>
          <button type="button" class="btn btn-primary float-end" onclick="nextStep()">Next</button>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="card mb-3 step-content d-none" id="step-2">
        <div class="card-body">
          <h5 class="card-title">Address</h5>
          <input type="text" class="form-control mb-3" placeholder="Street Address" required>
          <input type="text" class="form-control mb-3" placeholder="City" required>
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" onclick="prevStep()">Previous</button>
            <button type="button" class="btn btn-primary" onclick="nextStep()">Next</button>
          </div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="card mb-3 step-content d-none" id="step-3">
        <div class="card-body">
          <h5 class="card-title">Enter payment details</h5>
          <input type="text" class="form-control mb-3" placeholder="Card Number" required>
          <input type="text" class="form-control mb-3" placeholder="Expiration" required>
          <input type="text" class="form-control mb-3" placeholder="Name on Card" required>
          <input type="text" class="form-control mb-3" placeholder="CVV" required>
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" onclick="prevStep()">Previous</button>
            <button type="button" class="btn btn-primary" onclick="nextStep()">Next</button>
          </div>
        </div>
      </div>

      <!-- Step 4 -->
      <div class="card mb-3 step-content d-none" id="step-4">
        <div class="card-body">
          <h5 class="card-title text-success">Completed</h5>
          <p>Thank you! Your order has been placed successfully.</p>
          <button type="button" class="btn btn-secondary" onclick="prevStep()">Previous</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentStep = 1;

    function updateStepView() {
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`step-${i}`).classList.add("d-none");
        document.getElementById(`step-${i}-indicator`).classList.remove("active", "completed");

        if (i < currentStep) {
          document.getElementById(`step-${i}-indicator`).classList.add("completed");
        } else if (i === currentStep) {
          document.getElementById(`step-${i}`).classList.remove("d-none");
          document.getElementById(`step-${i}-indicator`).classList.add("active");
        }
      }
    }

    function nextStep() {
      if (currentStep < 4) {
        currentStep++;
        updateStepView();
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateStepView();
      }
    }

    // Initial setup
    updateStepView();
  </script>
</body>
</html>
